<!-- Root = language router, no content.
     Remembered RU|EN choice wins; otherwise browser language ru/kk or region RU/KZ -> /ru/,
     everyone else -> /en/. Query (UTMs) and hash are kept. No JS -> /en/. -->
<script>
(function () {
  var to = '/en/';
  try {
    var saved = null; try { saved = localStorage.getItem('ec_lang'); } catch (e) {}
    if (saved === 'ru' || saved === 'en') to = '/' + saved + '/';
    else {
      var l = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
      if (/^(ru|kk)(-|$)/.test(l) || /-(ru|kz)$/.test(l)) to = '/ru/';
    }
  } catch (e) {}
  location.replace(to + location.search + location.hash);
})();
</script>
